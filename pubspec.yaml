name: e_commerce
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  go_router: ^17.0.0
  l10n_flutter: ^1.0.7
  intl: any
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.2
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.1
  shimmer_animation: ^2.2.2+1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.6


  flutter_lints: ^5.0.0


flutter:
  generate: true
  uses-material-design: true

  assets:
     - assets/images/
     - assets/icons/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
        - asset: assets/fonts/Montserrat-Black.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
        - asset: assets/fonts/Montserrat-ExtraLight.ttf
        - asset: assets/fonts/Montserrat-Light.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
        - asset: assets/fonts/Montserrat-Thin.ttf

